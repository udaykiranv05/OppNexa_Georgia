name: Georgia Procurement Tracker
on:
  workflow_dispatch:
  schedule:
    # 04:30 UTC = 10:00 AM IST every day
    - cron: '30 4 * * *'
permissions:
  contents: write
jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run Georgia tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: '1T_cg_DBR5WG7vrQZuNqV4hP6BC_BY5sMpwx1v7j5IoU'
          TRACKER_GID: '2125924989'
          REVIEW_GID: '1667806659'
          MAX_DETAILS_PER_RUN: '200'
          MAX_PAGES_PER_KEYWORD: '10'
          REQUEST_DELAY_SECONDS: '0.5'
        run: python main.py
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/georgia_diagnostics.json || true
          git diff --cached --quiet || git commit -m 'Update Georgia procurement diagnostics'
          git push || true
