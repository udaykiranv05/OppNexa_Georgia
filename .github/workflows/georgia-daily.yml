name: Georgia Procurement Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

# Prevent two scheduled/manual runs from pushing generated data simultaneously.
concurrency:
  group: georgia-procurement-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-tracker:
    name: Run Georgia procurement tracker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run Georgia tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: '1T_cg_DBR5WG7vrQZuNqV4hP6BC_BY5sMpwx1v7j5IoU'
          TRACKER_GID: '2125924989'
          REVIEW_GID: '1667806659'
          MAX_DETAILS_PER_RUN: '200'
          MAX_PAGES_PER_KEYWORD: '10'
          REQUEST_DELAY_SECONDS: '0.5'
          PYTHONUNBUFFERED: '1'
        run: python -u main.py

      - name: Show generated files
        if: always()
        run: |
          echo '=== data directory ==='
          ls -lah data/ || true
          echo '=== diagnostics ==='
          if [ -f data/georgia_diagnostics.json ]; then cat data/georgia_diagnostics.json; else echo 'Diagnostics not generated'; fi

      - name: Upload generated data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: georgia-procurement-data
          path: |
            data/georgia_leads.csv
            data/georgia_leads.json
            data/georgia_manual_review.csv
            data/georgia_manual_review.json
            data/georgia_diagnostics.json
          if-no-files-found: warn
          retention-days: 30

      # Only commit outputs if the scraper and Sheets sync both completed successfully.
      - name: Commit generated data files
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/georgia_leads.csv data/georgia_leads.json data/georgia_manual_review.csv data/georgia_manual_review.json data/georgia_diagnostics.json

          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
            exit 0
          fi

          git commit -m 'Update Georgia procurement data'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
